name: Publish Package

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**'
      - '!.github/**'
      - '!README.md'
      - '!LICENSE'
      - '!.gitignore'

  workflow_dispatch:
    inputs:
      level:
        description: 'Release level (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: publish-package-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

# pkger (used internally by aux4/action's install/test/publish steps) resolves
# package dependencies against this registry; empty = pkger's prod default.
env:
  AUX4_REGISTRY_URL: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Lint
        uses: aux4/action@v1
        with:
          command: lint
          strict: 'true'

  # A combined test directory (all 8 files, one ~400s single jest process,
  # plus a job-level ElasticMQ container running for the whole job even
  # though only the provider matrix below needs it) was the source of
  # intermittent CI-only failures: under load, aux4 bot worker/queue/mock
  # processes from the big provider matrix starved the smaller e2e test that
  # ran after it, producing "mock verify: recorded 0 request(s)". Splitting
  # into two independent jobs/runners over two physical test directories
  # (package/test/core, package/test/providers) removes that cross-file
  # resource contention instead of widening more sleep constants.
  test-linux-core:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run core test group
        uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build
          test_directory: test/core
          packages: aux4/mock

  test-linux-providers:
    needs: [lint]
    runs-on: ubuntu-latest
    # the sqs/cloud provider sections of bot__whatsapp-e2e-providers.test.md need a real
    # SQS-API-compatible endpoint; ElasticMQ runs as a sibling service container on the
    # job's network, same pattern as aux4/queue-sqs and aux4/cloud-queue's own CI. Scoped
    # to this job only — the core group above never needs it.
    services:
      elasticmq:
        image: softwaremill/elasticmq-native
        ports:
          - 19781:9324
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run provider matrix test group
        uses: aux4/action@v1
        with:
          command: test
          build_command: npm run build
          test_directory: test/providers
          packages: aux4/mock aux4/queue-sqs aux4/cloud-queue

  publish:
    needs: [lint, test-linux-core, test-linux-providers]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Mint prod hub publish token
        id: mint
        if: github.ref_name == 'main'
        env:
          CLIENT_ID: ${{ secrets.AUX4_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      # The dev hub is validated by dev SSO, so a prod token is rejected there.
      # Mint a short-lived dev publish token from the dev publisher client
      # credentials. Only runs on the dev branch.
      - name: Mint dev hub publish token
        id: devmint
        if: github.ref_name == 'dev'
        env:
          CLIENT_ID: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AUX4_DEV_PUBLISHER_CLIENT_SECRET }}
        run: |
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ]; then echo "::error::dev publisher client id/secret not set"; exit 1; fi
          TOK=$(curl -sf -u "$CLIENT_ID:$CLIENT_SECRET" -d grant_type=client_credentials https://dev.sso.aux4.io/token | jq -r '.access_token // empty')
          if [ -z "$TOK" ]; then echo "::error::client_credentials mint returned no access_token from dev SSO"; exit 1; fi
          echo "::add-mask::$TOK"; echo "token=$TOK" >> "$GITHUB_OUTPUT"

      - name: Publish
        uses: aux4/action@v1
        with:
          command: publish
          level: ${{ inputs.level || 'patch' }}
          # dev -> minted dev token; main -> minted prod token
          aux4_token: ${{ github.ref_name == 'dev' && steps.devmint.outputs.token || steps.mint.outputs.token }}
          # dev -> dev hub registry; main -> default (prod) hub
          registry: ${{ github.ref_name == 'dev' && 'https://dev.api.hub.aux4.io/v1/packages' || '' }}
          github_token: ${{ secrets.GITHUB_TOKEN }}